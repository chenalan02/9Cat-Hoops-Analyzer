services:
  backend:
    build:
      context: . # The "Search Area" is the root
      dockerfile: backend/Dockerfile # The "Recipe" is in the folder
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./yahoo_auth:/app/auth
    env_file: .env
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/backend

  frontend:
    build:
      context: ./frontend # Frontend usually stays isolated
      dockerfile: Dockerfile
    ports:
      - "5500:80"
    depends_on:
      - backend
