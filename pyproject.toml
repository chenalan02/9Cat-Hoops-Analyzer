[project]
name = "9cathoops"
version = "0.1.0"
description = ""
authors = [
    {name = "Alan Chen",email = "chenalan2002@gmail.com"}
]
license = {text = "MIT"}
requires-python = "^3.13.0"
dependencies = [
    "numpy (>=2.4.2,<3.0.0)",
    "scipy (>=1.17.1,<2.0.0)",
    "fastapi (>=0.135.1,<0.136.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "uvicorn[standard] (>=0.41.0,<0.42.0)",
    "pandas (>=3.0.1,<4.0.0)",
    "nba-api (>=1.11.4,<2.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "databricks-sdk (>=0.94.0,<0.95.0)",
    "yfpy (>=17.0.0,<18.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "matplotlib (>=3.10.8,<4.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "pyarrow (>=23.0.1,<24.0.0)"
]

[tool.poetry]
package-mode = false